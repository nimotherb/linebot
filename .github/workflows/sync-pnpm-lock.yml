name: Update pnpm lockfiles and build verification

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  sync-pnpm-lock:
    name: Install & Sync pnpm lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Enable and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Back office dependencies
        working-directory: "Back office"
        run: pnpm install --ignore-scripts

      - name: Install official-website dependencies
        working-directory: official-website
        run: pnpm install --ignore-scripts

      - name: Commit and push updated lockfiles if changed
        run: |
          git status --porcelain
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update pnpm-lock.yaml via workflow"
            git push
          else
            echo "No lockfile changes to commit"
          fi
