name: Verify frontend lockfiles and builds

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-frontends:
    name: Install and build both frontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install and build Back office
        working-directory: "Back office"
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install and build official website
        working-directory: official-website
        run: |
          npm ci
          npm run build
